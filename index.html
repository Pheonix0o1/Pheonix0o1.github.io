<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pheonix0o1 | Connect</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg-dark: #090b10;
      --card-bg: rgba(20, 24, 36, 0.65);
      --card-border: rgba(255, 255, 255, 0.08);
      --text-main: #f3f4f6;
      --text-muted: #9ca3af;
      --btn-bg: rgba(255, 255, 255, 0.04);
      --btn-border: rgba(255, 255, 255, 0.08);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Outfit', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background-color: var(--bg-dark);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 24px 16px;
      overflow-x: hidden;
      position: relative;
    }

    /* Ambient background glow orbs */
    body::before,
    body::after {
      content: '';
      position: fixed;
      width: 380px;
      height: 380px;
      border-radius: 50%;
      filter: blur(110px);
      z-index: -1;
      opacity: 0.35;
      pointer-events: none;
    }

    body::before {
      background: #6366f1;
      top: -100px;
      left: -80px;
    }

    body::after {
      background: #ec4899;
      bottom: -100px;
      right: -80px;
    }

    /* Main glass container */
    .card {
      width: 100%;
      max-width: 420px;
      background: var(--card-bg);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--card-border);
      border-radius: 28px;
      padding: 36px 28px 28px;
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.5);
      text-align: center;
      animation: fadeUp 0.6s ease-out forwards;
    }

    @keyframes fadeUp {
      from {
        opacity: 0;
        transform: translateY(18px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* Profile Header */
    .avatar-ring {
      width: 96px;
      height: 96px;
      margin: 0 auto 16px;
      padding: 3px;
      border-radius: 50%;
      background: linear-gradient(135deg, #6366f1, #ec4899, #f59e0b);
      box-shadow: 0 0 24px rgba(236, 72, 153, 0.25);
    }

    .avatar {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      background: #131722;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2.2rem;
      font-weight: 700;
      letter-spacing: -1px;
      color: #fff;
      overflow: hidden;
    }

    .avatar img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .name {
      font-size: 1.6rem;
      font-weight: 700;
      letter-spacing: -0.3px;
      margin-bottom: 4px;
    }

    .handle {
      font-size: 0.9rem;
      color: var(--text-muted);
      margin-bottom: 14px;
    }

    .bio {
      font-size: 0.95rem;
      line-height: 1.5;
      color: #d1d5db;
      margin-bottom: 28px;
      padding: 0 8px;
    }

    /* Social Links Stack */
    .links {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .link-btn {
      display: flex;
      align-items: center;
      justify-content: space-between;
      text-decoration: none;
      color: var(--text-main);
      background: var(--btn-bg);
      border: 1px solid var(--btn-border);
      padding: 14px 18px;
      border-radius: 16px;
      transition: transform 0.2s ease, background 0.2s ease, border-color 0.2s ease, box-shadow 0.2s ease;
    }

    .link-left {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .icon-box {
      width: 36px;
      height: 36px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(255, 255, 255, 0.06);
      transition: background 0.2s ease, color 0.2s ease;
    }

    .icon-box svg {
      width: 20px;
      height: 20px;
      fill: currentColor;
    }

    .link-text {
      text-align: left;
    }

    .link-title {
      display: block;
      font-size: 1rem;
      font-weight: 600;
      line-height: 1.2;
    }

    .link-sub {
      display: block;
      font-size: 0.78rem;
      color: var(--text-muted);
      margin-top: 2px;
    }

    .arrow {
      width: 18px;
      height: 18px;
      color: var(--text-muted);
      transition: transform 0.2s ease, color 0.2s ease;
    }

    /* Hover States */
    .link-btn:hover {
      transform: translateY(-2px);
      background: rgba(255, 255, 255, 0.07);
    }

    .link-btn:hover .arrow {
      transform: translateX(3px);
      color: #fff;
    }

    /* Platform-specific accent glows */
    .link-btn.instagram:hover {
      border-color: rgba(225, 48, 108, 0.5);
      box-shadow: 0 8px 24px rgba(225, 48, 108, 0.16);
    }
    .link-btn.instagram:hover .icon-box {
      background: linear-gradient(45deg, #f09433, #e6683c, #dc2743, #cc2366, #bc1888);
      color: #fff;
    }

    .link-btn.youtube:hover {
      border-color: rgba(255, 0, 0, 0.5);
      box-shadow: 0 8px 24px rgba(255, 0, 0, 0.16);
    }
    .link-btn.youtube:hover .icon-box {
      background: #ff0000;
      color: #fff;
    }

    .link-btn.facebook:hover {
      border-color: rgba(24, 119, 242, 0.5);
      box-shadow: 0 8px 24px rgba(24, 119, 242, 0.16);
    }
    .link-btn.facebook:hover .icon-box {
      background: #1877f2;
      color: #fff;
    }

    .link-btn.pinterest:hover {
      border-color: rgba(230, 0, 35, 0.5);
      box-shadow: 0 8px 24px rgba(230, 0, 35, 0.16);
    }
    .link-btn.pinterest:hover .icon-box {
      background: #e60023;
      color: #fff;
    }

    /* Discord Static Badge Card */
    .link-btn.discord {
      cursor: default;
    }
    .link-btn.discord:hover {
      border-color: rgba(88, 101, 242, 0.55);
      box-shadow: 0 8px 24px rgba(88, 101, 242, 0.18);
    }
    .link-btn.discord:hover .icon-box {
      background: #5865f2;
      color: #fff;
    }

    .discord-tag {
      font-size: 0.8rem;
      font-weight: 500;
      padding: 5px 10px;
      border-radius: 999px;
      background: rgba(88, 101, 242, 0.18);
      color: #a5b4fc;
      border: 1px solid rgba(88, 101, 242, 0.35);
      user-select: all; /* Makes the username highlight in one tap/click */
    }

    /* Footer */
    footer {
      margin-top: 26px;
      font-size: 0.78rem;
      color: #6b7280;
    }
  </style>
</head>
